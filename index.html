<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Checklist One Piece</title>
<style>
  :root {
    --fondo: #0f172a;
    --tarjeta: #1e293b;
    --tarjeta-hover: #243247;
    --borde: #334155;
    --texto: #e2e8f0;
    --suave: #94a3b8;
    --acento: #f59e0b;
    --verde: #22c55e;
    --rojo: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    padding: 20px 14px 60px;
    line-height: 1.5;
  }
  header { max-width: 900px; margin: 0 auto 20px; text-align: center; }
  h1 { font-size: 1.7rem; color: var(--acento); margin-bottom: 4px; }
  .sub { color: var(--suave); font-size: 0.9rem; }

  .barra-global {
    max-width: 900px; margin: 0 auto 18px;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 12px; padding: 14px 16px;
  }
  .barra-global .info {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; margin-bottom: 8px;
  }
  .progreso { height: 12px; background: #0b1220; border-radius: 8px; overflow: hidden; }
  .progreso > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f59e0b, #22c55e);
    transition: width 0.3s;
  }

  .botones {
    max-width: 900px; margin: 0 auto 24px;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    background: var(--tarjeta); color: var(--texto);
    border: 1px solid var(--borde); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    transition: all 0.2s;
  }
  button:hover { background: var(--tarjeta-hover); border-color: var(--acento); }
  button.peligro:hover { border-color: var(--rojo); color: #f87171; }

  .titulo-seccion {
    max-width: 900px; margin: 0 auto 6px;
    font-size: 1.15rem; color: var(--acento);
    border-left: 4px solid var(--acento);
    padding-left: 10px;
  }
  .subtitulo-seccion {
    max-width: 900px; margin: 0 auto 18px;
    font-size: 0.82rem; color: var(--suave);
    padding-left: 14px;
  }

  /* ---- TARJETA GENERAL ---- */
  .saga {
    max-width: 900px; margin: 0 auto 14px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .saga::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(15, 23, 42, 0.85) 0%,
      rgba(15, 23, 42, 0.75) 50%,
      rgba(15, 23, 42, 0.90) 100%
    );
    z-index: 0;
  }
  .saga-header, .saga-body { position: relative; z-index: 1; }

  .saga-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .saga-header:hover { background: rgba(36, 50, 71, 0.95); }

  /* Distintivo para películas */
  .badge-tipo {
    font-size: 0.6rem; padding: 2px 7px;
    border-radius: 20px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .badge-canon {
    background: #14532d; color: #4ade80;
    border: 1px solid #166534;
  }
  .badge-nocanon {
    background: #451a03; color: #fb923c;
    border: 1px solid #7c2d12;
  }

  .saga-header .portada {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.1rem; color: #fff;
    flex-shrink: 0; overflow: hidden;
  }
  .saga-header .portada img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .saga-header .saga-info { flex: 1; min-width: 0; }
  .saga-header .saga-info h3 {
    font-size: 1rem; color: var(--texto); margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .saga-header .saga-info .episodios {
    font-size: 0.78rem; color: var(--suave);
  }
  .saga-header .flecha {
    color: var(--suave); font-size: 0.9rem;
    transition: transform 0.3s;
  }
  .saga.abierta .saga-header .flecha { transform: rotate(180deg); }

  .saga-body {
    display: none;
    padding: 14px 16px 16px;
    border-top: 1px solid rgba(51, 65, 85, 0.5);
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(2px);
  }
  .saga.abierta .saga-body { display: block; }

  /* Personajes */
  .personajes {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px dashed #2b3b55;
  }
  .personaje {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; font-size: 0.7rem; color: var(--texto); width: 54px;
    text-align: center;
  }
  .personaje .avatar-wrap {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--borde);
    overflow: hidden;
    background: #0b1220;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--acento);
    font-size: 1rem;
  }
  .personaje img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }

  .resumen {
    font-size: 0.8rem; color: var(--texto);
    padding: 8px 10px; margin-bottom: 12px;
    background: rgba(11, 18, 32, 0.8);
    border-radius: 6px;
    border-left: 3px solid var(--acento);
  }

  .items { display: flex; flex-direction: column; gap: 0; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-bottom: 1px dashed #2b3b55;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 2px;
    accent-color: var(--verde); cursor: pointer;
    flex-shrink: 0;
  }
  .item label { cursor: pointer; font-size: 0.88rem; flex: 1; }
  .item .tag {
    display: inline-block;
    font-size: 0.65rem; padding: 1px 7px;
    border-radius: 20px; margin-left: 6px;
    font-weight: 600; white-space: nowrap;
    background: #3b2f1a; color: var(--acento);
  }
  .item .tag.evitar { background: #3b1f1f; color: #f87171; }
  .item .tag.nota { background: #1f2f3b; color: #7dd3fc; }
  .item.hecho label { opacity: 0.45; text-decoration: line-through; }

  /* Película no canon: tarjeta más apagada */
  .saga.pelicula-nocanon {
    opacity: 0.75;
    border-style: dashed;
  }

  #errorBox {
    max-width: 900px; margin: 20px auto;
    background: #3b1f1f; border: 1px solid var(--rojo);
    color: #fca5a5; padding: 12px; border-radius: 8px;
    font-size: 0.85rem; display: none;
    font-family: monospace; white-space: pre-wrap;
  }
</style>

// ========= AVATAR DE RESPALDO =========
function makeAvatarRespaldo(nombre, color) {
  const letra = (nombre || "?").charAt(0).toUpperCase();
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
              '<rect width="100" height="100" rx="50" fill="' + color + '"/>' +
              '<text x="50" y="70" text-anchor="middle" font-size="55" ' +
              'fill="#ffffff" font-family="Arial,sans-serif" font-weight="bold">' +
              letra + '</text></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// ========= ESTADO =========
const CLAVE = "onepiece_checklist_v5";
let estado = {};
try {
  const guardado = localStorage.getItem(CLAVE);
  if (guardado) estado = JSON.parse(guardado);
} catch(e) { estado = {}; }

// ========= RENDER =========
const contenedor = document.getElementById("contenedor");

CONTENIDO.forEach(function(bloque, i) {
  const esPelicula = bloque.tipo === "pelicula";
  const esCanon = bloque.canon === true;

  const div = document.createElement("div");
  div.className = "saga abierta";
  if (esPelicula && !esCanon) {
    div.classList.add("pelicula-nocanon");
  }
  if (bloque.fondo) {
    div.style.backgroundImage = "url('" + bloque.fondo + "')";
  }

  // --- HEADER ---
  const header = document.createElement("div");
  header.className = "saga-header";

  const portada = document.createElement("div");
  portada.className = "portada";
  portada.style.background = bloque.color || "#555";
  portada.textContent = esPelicula ? "🎬" : (i + 1);
  header.appendChild(portada);

  const info = document.createElement("div");
  info.className = "saga-info";

  const h3 = document.createElement("h3");
  h3.textContent = bloque.nombre;

  // Badge CANON / NO CANON para películas
  if (esPelicula) {
    const badge = document.createElement("span");
    badge.className = "badge-tipo " + (esCanon ? "badge-canon" : "badge-nocanon");
    badge.textContent = esCanon ? "CANON" : "NO CANON";
    h3.appendChild(badge);
  }

  const ep = document.createElement("div");
  ep.className = "episodios";
  ep.textContent = bloque.episodios || "";

  info.appendChild(h3);
  info.appendChild(ep);
  header.appendChild(info);

  const flecha = document.createElement("span");
  flecha.className = "flecha";
  flecha.textContent = "▼";
  header.appendChild(flecha);

  header.addEventListener("click", function() {
    div.classList.toggle("abierta");
  });

  div.appendChild(header);

  // --- BODY ---
  const body = document.createElement("div");
  body.className = "saga-body";

  // Personajes (si existen)
  if (bloque.personajes && bloque.personajes.length > 0) {
    const persDiv = document.createElement("div");
    persDiv.className = "personajes";
    bloque.personajes.forEach(function(p) {
      const pDiv = document.createElement("div");
      pDiv.className = "personaje";

      const wrap = document.createElement("div");
      wrap.className = "avatar-wrap";

      if (p.img) {
        const img = document.createElement("img");
        img.src = p.img;
        img.alt = p.nombre;
        img.onerror = function() {
          wrap.textContent = "";
          const respaldo = document.createElement("img");
          respaldo.src = makeAvatarRespaldo(p.nombre, bloque.color || "#555");
          respaldo.alt = p.nombre;
          wrap.appendChild(respaldo);
        };
        wrap.appendChild(img);
      } else {
        const respaldo = document.createElement("img");
        respaldo.src = makeAvatarRespaldo(p.nombre, bloque.color || "#555");
        respaldo.alt = p.nombre;
        wrap.appendChild(respaldo);
      }

      pDiv.appendChild(wrap);

      const span = document.createElement("span");
      span.textContent = p.nombre;
      pDiv.appendChild(span);

      persDiv.appendChild(pDiv);
    });
    body.appendChild(persDiv);
  }

  // Resumen
  if (bloque.resumen) {
    const resumen = document.createElement("p");
    resumen.className = "resumen";
    resumen.textContent = "📌 " + bloque.resumen;
    body.appendChild(resumen);
  }

  // Items
  if (bloque.items) {
    const itemsDiv = document.createElement("div");
    itemsDiv.className = "items";
    bloque.items.forEach(function(it) {
      const itemDiv = document.createElement("div");
      itemDiv.className = "item";
      itemDiv.id = "fila-" + it.id;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = it.id;
      checkbox.checked = !!estado[it.id];
      checkbox.addEventListener("change", function(e) {
        estado[it.id] = e.target.checked;
        try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch(err) {}
        actualizar();
      });

      const label = document.createElement("label");
      label.htmlFor = it.id;
      label.textContent = it.texto;

      if (it.tag) {
        const tag = document.createElement("span");
        tag.className = "tag" +
          (it.tag === "evitar" ? " evitar" : (it.tag === "nota" ? " nota" : ""));
        tag.textContent = it.tag.toUpperCase();
        label.appendChild(tag);
      }

      itemDiv.appendChild(checkbox);
      itemDiv.appendChild(label);
      itemsDiv.appendChild(itemDiv);
    });
    body.appendChild(itemsDiv);
  }

  div.appendChild(body);
  contenedor.appendChild(div);
});

// ========= ACTUALIZAR PROGRESO =========
// Solo cuentan: sagas + películas CANON
function actualizar() {
  let total = 0, hechos = 0;
  CONTENIDO.forEach(function(bloque) {
    const cuenta = bloque.tipo === "saga" || bloque.canon === true;
    if (!cuenta) return;
    if (!bloque.items) return;

    bloque.items.forEach(function(it) {
      total++;
      if (estado[it.id]) hechos++;
      const fila = document.getElementById("fila-" + it.id);
      if (fila) {
        if (estado[it.id]) fila.classList.add("hecho");
        else fila.classList.remove("hecho");
      }
    });
  });
  const pct = total ? Math.round(hechos / total * 100) : 0;
  document.getElementById("barraGlobal").style.width = pct + "%";
  document.getElementById("progresoTexto").textContent = "Progreso global: " + pct + "%";
  document.getElementById("contador").textContent = hechos + " / " + total + " ítems (solo canon)";
}

// ========= CONTROLES =========
function expandirTodo(abrir) {
  document.querySelectorAll(".saga").forEach(function(s) {
    if (abrir) s.classList.add("abierta");
    else s.classList.remove("abierta");
  });
}

function reiniciar() {
  if (confirm("¿Seguro que quieres borrar todo el progreso?")) {
    estado = {};
    try { localStorage.removeItem(CLAVE); } catch(e) {}
    document.querySelectorAll('input[type="checkbox"]').forEach(function(c) { c.checked = false; });
    actualizar();
  }
}

actualizar();

} catch (error) {
  const box = document.getElementById("errorBox");
  box.style.display = "block";
  box.textContent = "⚠️ ERROR al cargar la checklist:\n" + error.message + "\n\n" + error.stack;
  console.error(error);
}
</script>
