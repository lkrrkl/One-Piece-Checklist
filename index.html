<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Checklist One Piece</title>
<style>
  :root {
    --onepiece-blue:   #2E62A3;
    --onepiece-sky:    #62C3F8;
    --onepiece-red:    #D70000;
    --onepiece-yellow: #FFCD00;
    --onepiece-brown:  #AF6528;
    --onepiece-black:  #000000;
    --onepiece-white:  #FFFFFF;

    --fondo: #0a0f1e;
    --tarjeta: #111a2e;
    --borde: #1e2f4a;
    --texto: #f0f6ff;
    --suave: #8ba3c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #111a2e 0%, var(--fondo) 60%, #000 100%);
    background-attachment: fixed;
    color: var(--texto);
    padding: 20px 14px 60px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header { max-width: 900px; margin: 0 auto 20px; text-align: center; }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 .bandera {
    font-size: 1.6rem;
    color: var(--onepiece-white);
    -webkit-text-fill-color: var(--onepiece-white);
    background: none;
    -webkit-background-clip: initial;
    background-clip: initial;
    filter: drop-shadow(0 0 6px rgba(255, 205, 0, 0.5));
  }
  h1 .titulo-gradiente {
    background: linear-gradient(90deg, var(--onepiece-yellow), var(--onepiece-red), var(--onepiece-sky));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .sub { color: var(--suave); font-size: 0.9rem; }

  .barra-global {
    max-width: 900px; margin: 0 auto 18px;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .barra-global .info {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .estado-sync {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(139, 163, 199, 0.15);
    color: var(--suave);
    transition: all 0.2s;
  }
  .estado-sync.sincronizando { background: rgba(255, 205, 0, 0.15); color: var(--onepiece-yellow); }
  .estado-sync.ok { background: rgba(46, 98, 163, 0.25); color: var(--onepiece-sky); }
  .estado-sync.error { background: rgba(215, 0, 0, 0.2); color: #ff6b6b; }

  .progreso { height: 12px; background: #000814; border-radius: 8px; overflow: hidden; }
  .progreso > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--onepiece-sky), var(--onepiece-yellow), var(--onepiece-red));
    transition: width 0.3s;
  }

  .botones {
    max-width: 900px; margin: 0 auto 24px;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    background: var(--tarjeta); color: var(--texto);
    border: 1px solid var(--borde); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    transition: all 0.2s;
    font-family: inherit;
  }
  button:hover { background: #1e2f4a; border-color: var(--onepiece-yellow); color: var(--onepiece-yellow); }
  button.peligro:hover { border-color: var(--onepiece-red); color: var(--onepiece-red); }

  .titulo-seccion {
    max-width: 900px; margin: 0 auto 6px;
    font-size: 1.15rem; color: var(--onepiece-yellow);
    border-left: 4px solid var(--onepiece-red);
    padding-left: 10px;
  }
  .subtitulo-seccion {
    max-width: 900px; margin: 0 auto 18px;
    font-size: 0.82rem; color: var(--suave);
    padding-left: 14px;
  }

  .saga {
    max-width: 900px; margin: 0 auto 14px;
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: var(--tarjeta);
    min-height: 100px;
    transition: background-image 0.4s ease;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  .saga::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10, 15, 30, 0.82) 0%,
      rgba(10, 15, 30, 0.68) 50%,
      rgba(10, 15, 30, 0.90) 100%
    );
    z-index: 0;
    pointer-events: none;
  }
  .saga-header, .saga-body { position: relative; z-index: 1; }

  .estado-fondo {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .estado-fondo.cargando {
    opacity: 0.8;
    background: rgba(255, 205, 0, 0.15);
    color: var(--onepiece-yellow);
  }
  .estado-fondo.fallback {
    opacity: 0.5;
    background: rgba(139, 163, 199, 0.15);
    color: var(--suave);
  }
  .estado-fondo.cargando::after {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-left: 4px;
    animation: pulso 1s infinite;
    vertical-align: middle;
  }
  @keyframes pulso {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .saga-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    background: rgba(17, 26, 46, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  .saga-header:hover { background: rgba(30, 47, 74, 0.85); }

  .badge-tipo {
    font-size: 0.6rem; padding: 2px 7px;
    border-radius: 20px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .badge-canon {
    background: rgba(46, 98, 163, 0.25);
    color: var(--onepiece-sky);
    border: 1px solid var(--onepiece-blue);
  }
  .badge-nocanon {
    background: rgba(175, 101, 40, 0.2);
    color: #f0a56c;
    border: 1px solid var(--onepiece-brown);
  }

  .saga-header .portada {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.05rem;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(255, 205, 0, 0.25),
                0 0 16px rgba(255, 205, 0, 0.15);
    overflow: hidden;
  }
  .saga-header .portada .iconos-saga {
    display: flex; gap: 0; font-size: 1.1rem; line-height: 1;
  }
  .saga-header .portada .iconos-saga.pelicula {
    font-size: 0.9rem;
  }
  .saga-header .saga-info { flex: 1; min-width: 0; }
  .saga-header .saga-info h3 {
    font-size: 1rem; color: var(--texto); margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .saga-header .saga-info .meta {
    font-size: 0.78rem; color: var(--suave);
  }
  .saga-header .saga-info .meta .año {
    color: var(--onepiece-yellow);
    font-weight: 600;
  }
  .saga-header .acciones {
    display: flex; align-items: center; gap: 6px;
  }
  .btn-info {
    background: rgba(255, 205, 0, 0.15);
    border: 1px solid var(--onepiece-yellow);
    color: var(--onepiece-yellow);
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    transition: all 0.2s;
  }
  .btn-info:hover {
    background: var(--onepiece-yellow);
    color: var(--onepiece-black);
  }
  .saga-header .flecha {
    color: var(--suave); font-size: 0.9rem;
    transition: transform 0.3s;
  }
  .saga.abierta .saga-header .flecha { transform: rotate(180deg); color: var(--onepiece-yellow); }

  .saga-body {
    display: none;
    padding: 14px 16px 16px;
    background: rgba(10, 15, 30, 0.55);
    border-top: 1px solid rgba(30, 47, 74, 0.6);
  }
  .saga.abierta .saga-body { display: block; }

  .personajes {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px dashed #1e2f4a;
  }
  .personaje {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; font-size: 0.7rem; color: var(--texto); width: 60px;
    text-align: center;
  }
  .personaje .avatar-wrap {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--borde);
    overflow: hidden;
    background: #000814;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .personaje .avatar-wrap:hover {
    border-color: var(--onepiece-yellow);
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(255, 205, 0, 0.4);
  }
  .personaje .avatar-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .personaje .avatar-wrap::after {
    content: "ⓘ";
    position: absolute;
    bottom: -2px; right: -2px;
    background: var(--onepiece-yellow);
    color: var(--onepiece-black);
    width: 16px; height: 16px;
    border-radius: 50%;
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .personaje .avatar-wrap:hover::after { opacity: 1; }

  .resumen {
    font-size: 0.8rem; color: var(--texto);
    padding: 8px 10px; margin-bottom: 12px;
    background: rgba(0, 8, 20, 0.7);
    border-radius: 6px;
    border-left: 3px solid var(--onepiece-yellow);
  }

  .items { display: flex; flex-direction: column; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-bottom: 1px dashed #1e2f4a;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 2px;
    accent-color: var(--onepiece-yellow); cursor: pointer; flex-shrink: 0;
  }
  .item label { cursor: pointer; font-size: 0.88rem; flex: 1; }
  .item .tag {
    display: inline-block;
    font-size: 0.65rem; padding: 1px 7px;
    border-radius: 20px; margin-left: 6px;
    font-weight: 600; white-space: nowrap;
    background: rgba(255, 205, 0, 0.15);
    color: var(--onepiece-yellow);
  }
  .item .tag.evitar {
    background: rgba(215, 0, 0, 0.18);
    color: #ff6b6b;
  }
  .item .tag.nota {
    background: rgba(98, 195, 248, 0.15);
    color: var(--onepiece-sky);
  }
  .item.hecho label { opacity: 0.45; text-decoration: line-through; }

  .saga.pelicula-nocanon { opacity: 0.75; border-style: dashed; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  .modal-overlay.activo { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-content {
    background: linear-gradient(135deg, #0e1730 0%, #111a2e 100%);
    border: 2px solid var(--onepiece-yellow);
    border-radius: 14px;
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7),
                0 0 60px rgba(255, 205, 0, 0.1);
    animation: slideUp 0.3s;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(215, 0, 0, 0.2);
    border: 1px solid var(--onepiece-red);
    color: #ff6b6b;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    padding: 0;
    transition: all 0.2s;
  }
  .modal-close:hover {
    background: var(--onepiece-red);
    color: white;
    transform: rotate(90deg);
  }
  .modal-titulo {
    font-size: 1.3rem;
    color: var(--onepiece-yellow);
    margin-bottom: 4px;
    padding-right: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .modal-titulo .iconos-modal {
    display: flex;
    gap: 6px;
    font-size: 1.4rem;
  }
  .modal-subtitulo {
    font-size: 0.85rem;
    color: var(--suave);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--borde);
  }
  .modal-subtitulo .año-modal {
    color: var(--onepiece-yellow);
    font-weight: 600;
  }
  .modal-seccion {
    margin-bottom: 14px;
  }
  .modal-seccion-titulo {
    font-size: 0.8rem;
    color: var(--onepiece-sky);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-seccion-texto {
    font-size: 0.92rem;
    color: var(--texto);
    line-height: 1.6;
    background: rgba(0, 8, 20, 0.5);
    padding: 10px 14px;
    border-radius: 8px;
    border-left: 3px solid var(--onepiece-yellow);
  }
  .modal-avatar-grande {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid var(--onepiece-yellow);
    margin: 0 auto 12px;
    display: block;
    box-shadow: 0 0 20px rgba(255, 205, 0, 0.3);
  }
  .modal-badge-canon {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-left: 6px;
  }
  .modal-badge-canon.si {
    background: rgba(46, 98, 163, 0.25);
    color: var(--onepiece-sky);
    border: 1px solid var(--onepiece-blue);
  }
  .modal-badge-canon.no {
    background: rgba(175, 101, 40, 0.2);
    color: #f0a56c;
    border: 1px solid var(--onepiece-brown);
  }
</style>
</head>
<body>

<header>
  <h1>
    <span class="bandera">🏴‍☠️</span>
    <span class="titulo-gradiente">Checklist One Piece</span>
  </h1>
  <p class="sub">Marca lo que vas viendo. El progreso solo cuenta sagas y películas <strong>CANON</strong>.</p>
</header>

<div class="barra-global">
  <div class="info">
    <span id="progresoTexto">Progreso global: 0%</span>
    <span id="contador">0 / 0 ítems</span>
    <span id="estadoSync" class="estado-sync">Conectando...</span>
  </div>
  <div class="progreso"><div id="barraGlobal"></div></div>
</div>

<div class="botones">
  <button onclick="expandirTodo(true)">Expandir todo</button>
  <button onclick="expandirTodo(false)">Contraer todo</button>
  <button onclick="forzarSync()">🔄 Forzar sincronización</button>
  <button class="peligro" onclick="reiniciar()">Reiniciar progreso</button>
</div>

<h2 class="titulo-seccion">📖 Desglose de sagas y películas</h2>
<p class="subtitulo-seccion">Haz clic en el botón ℹ️ o en el avatar de cada personaje para ver su información.</p>

<div id="contenedor"></div>

<!-- MODAL -->
<div id="modal" class="modal-overlay" onclick="cerrarModalSiOverlay(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN DE JSONBIN.IO CON ACCESS KEY
   ---------------------------------------------------------------------
   1. Crea una cuenta en https://jsonbin.io
   2. Crea un Bin con contenido inicial: {}
   3. Copia el BIN_ID de la URL del bin
   4. Ve a "API Keys" → "Create Access Key"
      - Marca SOLO: Read y Update
      - NO marques: Create ni Delete
   5. Pega el BIN_ID y la ACCESS_KEY aquí abajo
   ===================================================================== */
const BIN_ID      = "6ad8370eac6210605a4457e0";
const ACCESS_KEY  = "$2a$10$FKFo1JSLGQaQqJWZxta4S.DSONuoRWS7mAaz/j6YtUWsvYRXz20G.";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

// ---- Utilidades de color ----
const C = {
  BLUE:   "#2E62A3",
  SKY:    "#62C3F8",
  RED:    "#D70000",
  YELLOW: "#FFCD00",
  BROWN:  "#AF6528",
  BLACK:  "#000000",
  WHITE:  "#FFFFFF"
};

function adjustColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0xFF) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}
function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#0a0f1e' : '#ffffff';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fandom(file) {
  return "https://onepiece.fandom.com/wiki/Special:FilePath/" + file;
}

function makePlaceholderFondo(color, icono, nombre) {
  const dark  = adjustColor(color, -40);
  const light = adjustColor(color, 15);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">' +
      '<defs>' +
        '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
          '<stop offset="0%" stop-color="' + color + '"/>' +
          '<stop offset="55%" stop-color="' + dark + '"/>' +
          '<stop offset="100%" stop-color="' + light + '"/>' +
        '</linearGradient>' +
        '<pattern id="s" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">' +
          '<rect width="24" height="48" fill="rgba(255,255,255,0.05)"/>' +
        '</pattern>' +
        '<pattern id="d" width="80" height="80" patternUnits="userSpaceOnUse">' +
          '<circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.10)"/>' +
          '<circle cx="60" cy="60" r="1.5" fill="rgba(255,255,255,0.10)"/>' +
        '</pattern>' +
      '</defs>' +
      '<rect width="800" height="400" fill="url(#g)"/>' +
      '<rect width="800" height="400" fill="url(#s)"/>' +
      '<rect width="800" height="400" fill="url(#d)"/>' +
      '<text x="720" y="380" text-anchor="end" font-size="220" opacity="0.12" font-family="Arial">' + icono + '</text>' +
      '<text x="30" y="375" font-size="14" fill="rgba(255,255,255,0.85)" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="1">' +
        nombre.toUpperCase() +
      '</text>' +
    '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function makeAvatarRespaldo(nombre, color) {
  const letra = (nombre || "?").charAt(0).toUpperCase();
  const dark = adjustColor(color, -25);
  const textColor = getTextColor(color);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<defs><linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="' + color + '"/>' +
        '<stop offset="100%" stop-color="' + dark + '"/>' +
      '</linearGradient></defs>' +
      '<circle cx="50" cy="50" r="50" fill="url(#ag)"/>' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>' +
      '<text x="50" y="68" text-anchor="middle" font-size="48" fill="' + textColor + '" ' +
        'font-family="Arial,sans-serif" font-weight="bold">' + letra + '</text>' +
    '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function cargarAvatar(imgEl, urls, nombre, color) {
  imgEl.src = makeAvatarRespaldo(nombre, color);
  if (!urls || urls.length === 0) return;
  imgEl.setAttribute("referrerpolicy", "no-referrer");

  let idx = 0;
  function intentar() {
    if (idx >= urls.length) return;
    const url = urls[idx++];
    const tmpCors = new Image();
    tmpCors.referrerPolicy = "no-referrer";
    tmpCors.crossOrigin = "anonymous";
    tmpCors.onload = function () {
      if (tmpCors.naturalWidth > 20 && tmpCors.naturalHeight > 20) {
        imgEl.crossOrigin = "anonymous";
        imgEl.src = url;
      } else {
        intentar();
      }
    };
    tmpCors.onerror = function () {
      const tmpNoCors = new Image();
      tmpNoCors.referrerPolicy = "no-referrer";
      tmpNoCors.onload = function () {
        if (tmpNoCors.naturalWidth > 20 && tmpNoCors.naturalHeight > 20) {
          imgEl.removeAttribute("crossorigin");
          imgEl.src = url;
        } else {
          intentar();
        }
      };
      tmpNoCors.onerror = intentar;
      tmpNoCors.src = url;
    };
    tmpCors.src = url;
  }
  intentar();
}

// ========== ESTADO GLOBAL ==========
let estado = {};

// ========== INDICADOR DE SINCRONIZACIÓN ==========
const estadoSyncEl = document.getElementById("estadoSync");
function setSyncEstado(texto, clase) {
  estadoSyncEl.textContent = texto;
  estadoSyncEl.className = "estado-sync" + (clase ? " " + clase : "");
}

/* =====================================================================
   SINCRONIZACIÓN CON JSONBIN.IO (usando Access Key)
   ===================================================================== */
async function cargarDesdeNube() {
  if (BIN_ID === "TU_BIN_ID_AQUÍ" || ACCESS_KEY === "TU_ACCESS_KEY_AQUÍ") {
    setSyncEstado("⚠️ Configura BIN_ID y ACCESS_KEY", "error");
    console.warn("Debes reemplazar BIN_ID y ACCESS_KEY en el código.");
    return false;
  }

  setSyncEstado("Cargando...", "sincronizando");
  try {
    const res = await fetch(JSONBIN_URL + "/latest", {
      method: "GET",
      headers: {
        "X-Access-Key": ACCESS_KEY,
        "Content-Type": "application/json"
      }
    });
    if (res.status === 401) throw new Error("401 · Access Key inválida o expirada");
    if (res.status === 404) throw new Error("404 · Bin no encontrado (revisa BIN_ID)");
    if (res.status === 403) throw new Error("403 · Sin permisos (revisa scopes de la key)");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    estado = data.record || {};
    setSyncEstado("Sincronizado ✔", "ok");
    return true;
  } catch (e) {
    console.error("Error al cargar desde JSONBin:", e);
    setSyncEstado("❌ " + e.message, "error");
    return false;
  }
}

async function guardarEnNube() {
  if (BIN_ID === "TU_BIN_ID_AQUÍ" || ACCESS_KEY === "TU_ACCESS_KEY_AQUÍ") {
    setSyncEstado("⚠️ Configura BIN_ID y ACCESS_KEY", "error");
    return false;
  }

  setSyncEstado("Guardando...", "sincronizando");
  try {
    const res = await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": ACCESS_KEY
      },
      body: JSON.stringify(estado)
    });
    if (res.status === 401) throw new Error("401 · Access Key inválida");
    if (res.status === 403) throw new Error("403 · Sin permiso de escritura");
    if (!res.ok) throw new Error("HTTP " + res.status);
    setSyncEstado("Guardado ✔", "ok");
    return true;
  } catch (e) {
    console.error("Error al guardar en JSONBin:", e);
    setSyncEstado("❌ " + e.message, "error");
    return false;
  }
}

async function forzarSync() {
  const ok = await cargarDesdeNube();
  if (ok) {
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = !!estado[cb.id];
    });
    actualizarProgresoUI();
  }
}

function abrirModalInfoSaga(bloque) {
  const esPelicula = bloque.tipo === "pelicula";
  const esCanon = bloque.canon === true;
  const iconos = (bloque.iconos || ["🏴‍☠️"]).map(i => `<span>${i}</span>`).join("");
  const badge = esPelicula
    ? `<span class="modal-badge-canon ${esCanon ? 'si' : 'no'}">${esCanon ? 'CANON' : 'NO CANON'}</span>`
    : "";

  const personajesHTML = bloque.personajes && bloque.personajes.length
    ? `<div class="modal-seccion">
        <div class="modal-seccion-titulo">👥 Personajes clave y sus motivos</div>
        ${bloque.personajes.map(p => `
          <div class="modal-seccion-texto" style="margin-bottom:8px;">
            <strong style="color:${p.color}; text-transform:uppercase; letter-spacing:0.5px;">${escapeHtml(p.nombre)}</strong>
            <span style="display:block; margin-top:4px; font-size:0.88rem; color:var(--suave);">${escapeHtml(p.motivo || '')}</span>
          </div>
        `).join("")}
      </div>`
    : "";

  document.getElementById("modal-body").innerHTML = `
    <div class="modal-titulo">
      <span class="iconos-modal">${iconos}</span>
      <span>${escapeHtml(bloque.nombre)}</span>
      ${badge}
    </div>
    <div class="modal-subtitulo">
      <span class="año-modal">📅 ${escapeHtml(bloque.año || "")}</span>
      &nbsp;·&nbsp;
      <span>${escapeHtml(bloque.episodios || "")}</span>
    </div>
    <div class="modal-seccion">
      <div class="modal-seccion-titulo">📖 Descripción</div>
      <div class="modal-seccion-texto">${escapeHtml(bloque.descripcion || bloque.resumen || "")}</div>
    </div>
    ${bloque.resumen && bloque.descripcion ? `
      <div class="modal-seccion">
        <div class="modal-seccion-titulo">🎯 Puntos clave</div>
        <div class="modal-seccion-texto">${escapeHtml(bloque.resumen)}</div>
      </div>` : ""}
    ${personajesHTML}
  `;

  document.getElementById("modal").classList.add("activo");
}

function abrirModalInfoPersonaje(p) {
  const avatar = p.img
    ? `<img src="${p.img}" alt="${escapeHtml(p.nombre)}" class="modal-avatar-grande" referrerpolicy="no-referrer" onerror="this.src='${makeAvatarRespaldo(p.nombre, p.color)}'">`
    : `<img src="${makeAvatarRespaldo(p.nombre, p.color)}" alt="${escapeHtml(p.nombre)}" class="modal-avatar-grande">`;

  document.getElementById("modal-body").innerHTML = `
    ${avatar}
    <div class="modal-titulo" style="justify-content:center;">
      <span style="color:${p.color};">${escapeHtml(p.nombre)}</span>
    </div>
    <div class="modal-subtitulo" style="text-align:center;">Personaje clave</div>
    <div class="modal-seccion">
      <div class="modal-seccion-titulo">💭 Motivo / Sueño</div>
      <div class="modal-seccion-texto">${escapeHtml(p.motivo || "Sin información disponible.")}</div>
    </div>
  `;

  document.getElementById("modal").classList.add("activo");
}

function cerrarModal() {
  document.getElementById("modal").classList.remove("activo");
}
function cerrarModalSiOverlay(e) {
  if (e.target.id === "modal") cerrarModal();
}
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") cerrarModal();
});

// ========== RENDER ==========
const contenedor = document.getElementById("contenedor");
let indiceSaga = 0;

function renderizarTodo() {
  contenedor.innerHTML = "";
  indiceSaga = 0;

  CONTENIDO.forEach(function(bloque) {
    const esPelicula = bloque.tipo === "pelicula";
    const esCanon = bloque.canon === true;

    const div = document.createElement("div");
    div.className = "saga";
    if (esPelicula && !esCanon) div.classList.add("pelicula-nocanon");

    const estadoFondo = document.createElement("div");
    estadoFondo.className = "estado-fondo";
    div.appendChild(estadoFondo);

    // ---- HEADER ----
    const header = document.createElement("div");
    header.className = "saga-header";

    const portada = document.createElement("div");
    portada.className = "portada";
    portada.style.background =
      "linear-gradient(135deg, " + bloque.color + ", " + adjustColor(bloque.color, -25) + ")";
    portada.style.color = getTextColor(bloque.color);
    const iconos = bloque.iconos || ["🏴‍☠️"];
    const iconosHTML = `<div class="iconos-saga ${esPelicula ? 'pelicula' : ''}">${iconos.map(i => `<span>${i}</span>`).join("")}</div>`;
    portada.innerHTML = iconosHTML;
    header.appendChild(portada);

    const info = document.createElement("div");
    info.className = "saga-info";

    const h3 = document.createElement("h3");
    h3.textContent = bloque.nombre;

    if (esPelicula) {
      const badge = document.createElement("span");
      badge.className = "badge-tipo " + (esCanon ? "badge-canon" : "badge-nocanon");
      badge.textContent = esCanon ? "CANON" : "NO CANON";
      h3.appendChild(badge);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<span class="año">📅 ${escapeHtml(bloque.año || "")}</span> · ${escapeHtml(bloque.episodios || "")}`;

    info.appendChild(h3);
    info.appendChild(meta);
    header.appendChild(info);

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    const btnInfo = document.createElement("button");
    btnInfo.className = "btn-info";
    btnInfo.textContent = "ℹ";
    btnInfo.title = "Ver información de la " + (esPelicula ? "película" : "saga");
    btnInfo.addEventListener("click", function(e) {
      e.stopPropagation();
      abrirModalInfoSaga(bloque);
    });
    acciones.appendChild(btnInfo);

    const flecha = document.createElement("span");
    flecha.className = "flecha";
    flecha.textContent = "▼";
    acciones.appendChild(flecha);

    header.appendChild(acciones);

    header.addEventListener("click", function() { div.classList.toggle("abierta"); });
    div.appendChild(header);

    // ---- BODY ----
    const body = document.createElement("div");
    body.className = "saga-body";

    if (bloque.personajes && bloque.personajes.length > 0) {
      const persDiv = document.createElement("div");
      persDiv.className = "personajes";
      bloque.personajes.forEach(function(p) {
        const pDiv = document.createElement("div");
        pDiv.className = "personaje";

        const wrap = document.createElement("div");
        wrap.className = "avatar-wrap";
        wrap.title = "Clic para ver el motivo de " + p.nombre;
        wrap.addEventListener("click", function(e) {
          e.stopPropagation();
          abrirModalInfoPersonaje(p);
        });

        const img = document.createElement("img");
        img.alt = p.nombre;
        wrap.appendChild(img);

        const urls = p.img ? [p.img] : [];
        cargarAvatar(img, urls, p.nombre, p.color || bloque.color);

        pDiv.appendChild(wrap);
        const span = document.createElement("span");
        span.textContent = p.nombre;
        pDiv.appendChild(span);
        persDiv.appendChild(pDiv);
      });
      body.appendChild(persDiv);
    }

    if (bloque.resumen) {
      const resumen = document.createElement("p");
      resumen.className = "resumen";
      resumen.textContent = "📌 " + bloque.resumen;
      body.appendChild(resumen);
    }

    if (bloque.items) {
      const itemsDiv = document.createElement("div");
      itemsDiv.className = "items";
      bloque.items.forEach(function(it) {
        const itemDiv = document.createElement("div");
        itemDiv.className = "item";
        itemDiv.id = "fila-" + it.id;

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = it.id;
        cb.checked = !!estado[it.id];
        cb.addEventListener("change", function(e) {
          estado[it.id] = e.target.checked;
          actualizarProgresoUI();
          guardarEnNube();
        });

        const label = document.createElement("label");
        label.htmlFor = it.id;
        label.textContent = it.texto;

        if (it.tag) {
          const tag = document.createElement("span");
          tag.className = "tag" + (it.tag === "evitar" ? " evitar" : (it.tag === "nota" ? " nota" : ""));
          tag.textContent = it.tag.toUpperCase();
          label.appendChild(tag);
        }

        itemDiv.appendChild(cb);
        itemDiv.appendChild(label);
        itemsDiv.appendChild(itemDiv);
      });
      body.appendChild(itemsDiv);
    }

    div.appendChild(body);
    contenedor.appendChild(div);

    // ---- FONDO ----
    const placeholderFondo = makePlaceholderFondo(bloque.color, iconos[0] || "🏴‍☠️", bloque.nombre);
    div.style.backgroundImage = "url('" + placeholderFondo + "')";

    if (bloque.fondos && bloque.fondos.length > 0) {
      estadoFondo.textContent = "cargando";
      estadoFondo.className = "estado-fondo cargando";

      let idxF = 0;
      function intentarFondo() {
        if (idxF >= bloque.fondos.length) {
          estadoFondo.textContent = "placeholder";
          estadoFondo.className = "estado-fondo fallback";
          return;
        }
        const url = bloque.fondos[idxF++];
        const tmp = new Image();
        tmp.referrerPolicy = "no-referrer";
        let terminado = false;
        const timeout = setTimeout(function() {
          if (terminado) return;
          terminado = true;
          tmp.onload = tmp.onerror = null;
          intentarFondo();
        }, 3500);
        tmp.onload = function() {
          if (terminado) return;
          terminado = true;
          clearTimeout(timeout);
          if (tmp.naturalWidth < 20 || tmp.naturalHeight < 20) { intentarFondo(); return; }
          div.style.backgroundImage = "url('" + url + "')";
          estadoFondo.textContent = "cargado";
          estadoFondo.className = "estado-fondo";
          setTimeout(function() { estadoFondo.style.opacity = 0; }, 1500);
        };
        tmp.onerror = function() {
          if (terminado) return;
          terminado = true;
          clearTimeout(timeout);
          intentarFondo();
        };
        tmp.src = url;
      }
      intentarFondo();
    } else {
      estadoFondo.textContent = "";
    }
  });
}

// ========== PROGRESO ==========
function actualizarProgresoUI() {
  let total = 0, hechos = 0;
  CONTENIDO.forEach(function(bloque) {
    const cuenta = bloque.tipo === "saga" || bloque.canon === true;
    if (!cuenta || !bloque.items) return;
    bloque.items.forEach(function(it) {
      total++;
      if (estado[it.id]) hechos++;
      const fila = document.getElementById("fila-" + it.id);
      if (fila) {
        if (estado[it.id]) fila.classList.add("hecho");
        else fila.classList.remove("hecho");
      }
    });
  });
  const pct = total ? Math.round(hechos / total * 100) : 0;
  document.getElementById("barraGlobal").style.width = pct + "%";
  document.getElementById("progresoTexto").textContent = "Progreso global: " + pct + "%";
  document.getElementById("contador").textContent = hechos + " / " + total + " ítems (solo canon)";
}

// ========== CONTROLES ==========
function expandirTodo(abrir) {
  document.querySelectorAll(".saga").forEach(function(s) {
    if (abrir) s.classList.add("abierta");
    else s.classList.remove("abierta");
  });
}

async function reiniciar() {
  if (confirm("¿Seguro que quieres borrar todo el progreso? Esto también borrará el progreso guardado en JSONBin.")) {
    estado = {};
    await guardarEnNube();
    document.querySelectorAll('input[type="checkbox"]').forEach(function(c) { c.checked = false; });
    actualizarProgresoUI();
  }
}

// ========== INICIALIZACIÓN ==========
async function init() {
  renderizarTodo();
  const ok = await cargarDesdeNube();
  if (ok) {
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = !!estado[cb.id];
    });
    actualizarProgresoUI();
  } else {
    actualizarProgresoUI();
  }
}

init();
